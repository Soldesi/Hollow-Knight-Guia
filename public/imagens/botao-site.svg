<svg xmlns="http://www.w3.org/2000/svg" width="340" height="68" viewBox="0 0 340 68" role="img" aria-label="Acessar o site" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="borda" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7D78A8">
        <animate attributeName="stop-color" values="#7D78A8;#C9C5F0;#7D78A8" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#C9C5F0">
        <animate attributeName="stop-color" values="#C9C5F0;#7D78A8;#C9C5F0" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7D78A8">
        <animate attributeName="stop-color" values="#7D78A8;#C9C5F0;#7D78A8" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="fundo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E"/>
      <stop offset="100%" stop-color="#0F0D18"/>
    </linearGradient>
    <filter id="brilho" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="4" y="4" width="332" height="60" rx="30" fill="url(#fundo)" stroke="url(#borda)" stroke-width="2" filter="url(#brilho)"/>
  <rect x="10" y="10" width="320" height="48" rx="24" fill="none" stroke="#7D78A8" stroke-opacity="0.25" stroke-width="1"/>

  <text x="170" y="40" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#EDEBFA">✦ ACESSAR O SITE ✦</text>
</svg>
